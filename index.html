    <script>
      // Apply theme before paint to avoid a flash. Svelte's ThemeToggle will
      // re-apply (idempotent) once the app mounts.
      (function () {
        try {
          var saved = localStorage.getItem('ufc-theme');
          var dark =
            saved === 'dark' ||
            (saved === null &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
